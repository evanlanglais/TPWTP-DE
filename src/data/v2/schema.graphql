type Location {
    latitude: Float,
    longitude: Float
}

scalar ParkId
scalar RideId
scalar DateTime

type Park {
    id: ParkId!,
    name: String!,
    location: Location
    rides: [Ride]
}

type Ride {
    id: RideId!,
    name: String!,
    park: Park,
    layer1: Layer1Data,
    currentWaitTime: WaitTime
}

type OperatingDay {
    date: DateTime,
    waitTimes: [WaitTime]
}

type WaitTime {
    wait: Int,
    time: DateTime
}

enum Interval {
    DAY
    WEEK
    MONTH
    YEAR
}

type Layer1Data {
    currentWaitTime: WaitTime,
    historicalWaitTime(start: DateTime, end: DateTime, interval: Interval): [OperatingDay]
}

type Query {
    parks: [Park],
    someParks(ids: [ParkId]!): [Park],
    park(id: ParkId!): Park,
    rides: [Ride],
    someRides(ids: [RideId]!): [Ride],
    ride(id: RideId!): Ride
}
